openapi: 3.0.3
info:
  title: OpenDash API
  version: 0.1.0
  description: >-
    Persistent home-server dashboard API with single-administrator authentication.
    When authentication is disabled, dashboard routes are public, bootstrap reports
    authEnabled=false/bootstrapRequired=false, and all other auth endpoints return 404.

security:
  - sessionCookie: []

servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development server

paths:
  /bootstrap:
    get:
      security: []
      summary: Get bootstrap status
      operationId: getBootstrapStatus
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
    post:
      security: []
      summary: Create the one administrator
      operationId: bootstrapAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Administrator created and session started
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request
        "409":
          description: Administrator already exists
        "429":
          description: Too many attempts
  /auth/login:
    post:
      security: []
      summary: Start an administrator session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/session:
    get:
      security: []
      summary: Get current session
      operationId: getSession
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Authentication required
  /auth/logout:
    post:
      summary: End current session
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session ended
  /health:
    get:
      security: []
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readiness:
    get:
      summary: Runtime readiness
      operationId: getReadiness
      responses:
        "200":
          description: Readiness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Runtime not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /summary:
    get:
      summary: System summary
      operationId: getSummary
      responses:
        "200":
          description: System summary
          headers:
            X-OpenDash-Data-Source:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSummary"

  /attention:
    get:
      summary: Attention items
      operationId: getAttention
      responses:
        "200":
          description: Attention items
          headers:
            X-OpenDash-Data-Source:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttentionItem"

  /apps:
    get:
      summary: Installed apps
      operationId: getApps
      responses:
        "200":
          description: Installed apps
          headers:
            X-OpenDash-Data-Source:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstalledApp"

  /apps/{id}:
    get:
      summary: App detail
      operationId: getAppById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: App detail
          headers:
            X-OpenDash-Data-Source:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledApp"
        "400":
          description: Missing app id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog:
    get:
      summary: Catalog apps
      operationId: getCatalog
      responses:
        "200":
          description: Catalog apps
          headers:
            X-OpenDash-Data-Source:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogApp"

  /catalog/{id}:
    get:
      summary: Catalog app detail
      operationId: getCatalogAppById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalog app detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogAppDetail"
        "400":
          description: Missing app id
        "404":
          description: Catalog app not found

  /catalog/{id}/install-plan:
    get:
      summary: Preview an install plan for a catalog app
      operationId: getInstallPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Install plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallPlan"
        "400":
          description: Invalid manifest or request
        "404":
          description: Catalog app not found

  /catalog/{id}/install:
    post:
      summary: Install a catalog app
      operationId: installApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "202":
          description: Install operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "409":
          description: App already installed, operation in progress, or conflicts

  /operations/{id}:
    get:
      summary: Operation status
      operationId: getOperationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          description: Operation not found

  /apps/{id}/start:
    post:
      summary: Start an installed app
      operationId: startApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Start operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          description: App not found
        "409":
          description: Operation already in progress

  /apps/{id}/stop:
    post:
      summary: Stop an installed app
      operationId: stopApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Stop operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          description: App not found
        "409":
          description: Operation already in progress

  /apps/{id}/restart:
    post:
      summary: Restart an installed app
      operationId: restartApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Restart operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          description: App not found
        "409":
          description: Operation already in progress

  /apps/{id}/logs:
    get:
      summary: Tail app logs
      operationId: getAppLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lines
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
      responses:
        "200":
          description: Log output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogOutput"
        "404":
          description: App not found

  /apps/{id}/uninstall-plan:
    get:
      summary: Preview uninstall impact
      operationId: getUninstallPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Uninstall preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposePreview"
        "404":
          description: App not found

  /apps/{id}/uninstall:
    post:
      summary: Uninstall an app (retains data)
      operationId: uninstallApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Uninstall operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          description: App not found
        "409":
          description: Operation already in progress

  /protection:
    get:
      summary: Protection overview
      operationId: getProtection
      responses:
        "200":
          description: Protection overview
          headers:
            X-OpenDash-Data-Source:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionOverview"

  /activity:
    get:
      summary: Activity events
      operationId: getActivity
      responses:
        "200":
          description: Activity events
          headers:
            X-OpenDash-Data-Source:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /sources:
    get:
      summary: List GitHub manifest sources
      operationId: listSources
      responses:
        "200":
          description: List of manifest sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceListItem"
    post:
      summary: Add a previewed and confirmed GitHub source
      operationId: addSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSourceRequest"
      responses:
        "201":
          description: Source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestSource"
        "400":
          description: Invalid or unconfirmed source

  /sources/preview:
    post:
      summary: Preview a GitHub manifest source without storing it
      operationId: previewSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePreviewRequest"
      responses:
        "200":
          description: Source preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePreview"
        "400":
          description: Invalid URL or manifest

  /sources/{id}:
    delete:
      summary: Remove a manifest source
      operationId: removeSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Source removed
        "404":
          description: Source not found
        "409":
          description: Source is in use by an installed app

  /apps/{id}/update-plan:
    get:
      summary: Preview a safe update for a source-installed app
      operationId: getAppUpdatePlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Update preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreview"
        "400":
          description: App is not from a source or preview failed
        "404":
          description: App not found

  /apps/{id}/update:
    post:
      summary: Apply an exact reviewed source update
      description: Requires an authenticated session, X-CSRF-Token, exact preview commit/checksum, confirmation, and risk acknowledgement when the preview requires it.
      operationId: applyAppUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commitSha, checksum, confirmed]
              properties:
                commitSha: { type: string }
                checksum: { type: string }
                confirmed: { type: boolean }
                acknowledgedRisks: { type: boolean }
      responses:
        "202":
          description: Update operation accepted; poll the operation endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { description: Confirmation or risk acknowledgement missing }
        "409": { description: Stale preview, blocked update, or concurrent operation }

  /apps/{id}/backups:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List application backups
      responses:
        "200": { description: Backup archives }
    post:
      summary: Create an application-aware backup
      responses:
        "201": { description: Backup archive created }
  /backups/{id}/restore-preview:
    post:
      summary: Preview a restore without changing app data
      responses:
        "200": { description: Restore compatibility and integrity preview }
  /backups/{id}/verify:
    post:
      summary: Run an isolated restore verification drill
      responses:
        "200": { description: Verification result }
        "501": { description: Verification unavailable }
  /backups/{id}/restore:
    post:
      summary: Restore backup (currently disabled)
      responses:
        "501": { description: Destructive restore disabled }
  /recovery/export:
    get:
      summary: Export recovery inventory
      responses:
        "200": { description: Apps, sources, and backups inventory }
  /recovery/import-preview:
    post:
      summary: Validate and preview recovery inventory import
      responses:
        "200": { description: Import preview }

  /dashboard/preferences:
    get:
      summary: Get dashboard preferences
      operationId: getDashboardPreferences
      responses:
        "200":
          description: Dashboard preferences (defaults when not configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardPreferences" }
    put:
      summary: Replace dashboard preferences
      operationId: updateDashboardPreferences
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardPreferences" }
      responses:
        "200":
          description: Saved dashboard preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardPreferences" }
        "400": { description: Invalid preferences }
        "403": { description: Invalid CSRF token }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: opendash_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    DashboardPreferences:
      type: object
      additionalProperties: false
      required: [defaultView, tileDensity, tileSize, groupBy, sortBy, tileOrder, favoriteAppIds, hiddenFields]
      properties:
        defaultView: { type: string, enum: [grid, list] }
        tileDensity: { type: string, enum: [compact, normal, spacious] }
        tileSize: { type: string, enum: [small, medium, large, wide] }
        groupBy: { type: string, enum: [none, category, status, health] }
        sortBy: { type: string, enum: [manual, name, status, category] }
        tileOrder: { type: array, items: { type: string } }
        favoriteAppIds: { type: array, items: { type: string } }
        hiddenFields:
          type: object
          additionalProperties: false
          properties:
            version: { type: boolean }
            status: { type: boolean }
            health: { type: boolean }
            endpoints: { type: boolean }
        updatedAt: { type: string, format: date-time }
    BootstrapStatus:
      type: object
      required: [authEnabled, bootstrapRequired]
      properties:
        authEnabled:
          type: boolean
        bootstrapRequired:
          type: boolean
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
    AuthSession:
      type: object
      required: [username, csrfToken, expiresAt]
      properties:
        username:
          type: string
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadinessResponse:
      type: object
      required: [docker, compose, dockerVersion, composeVersion, errors]
      properties:
        docker:
          type: boolean
        compose:
          type: boolean
        dockerVersion:
          type: string
        composeVersion:
          type: string
        errors:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        request:
          type: string

    SystemSummary:
      type: object
      required:
        - appsRunning
        - appsTotal
        - protectionStatus
        - updatesAvailable
        - storageUsedGb
        - storageTotalGb
        - cpuPercent
        - memoryPercent
        - uptimeSeconds
        - health
      properties:
        appsRunning:
          type: integer
        appsTotal:
          type: integer
        protectionStatus:
          $ref: "#/components/schemas/ProtectionStatus"
        updatesAvailable:
          type: integer
        storageUsedGb:
          type: number
        storageTotalGb:
          type: number
        cpuPercent:
          type: number
        memoryPercent:
          type: number
        uptimeSeconds:
          type: integer
        health:
          $ref: "#/components/schemas/HealthStatus"
        demoData:
          type: boolean

    AttentionItem:
      type: object
      required:
        - id
        - severity
        - title
        - description
        - timestamp
        - dismissed
      properties:
        id:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        title:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        actionLabel:
          type: string
        actionRoute:
          type: string
        dismissed:
          type: boolean

    InstalledApp:
      type: object
      required:
        - id
        - name
        - icon
        - description
        - status
        - health
        - version
        - latestVersion
        - category
        - endpoints
        - services
        - storage
        - updatedAt
        - installedAt
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/AppStatus"
        health:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
        latestVersion:
          type: string
        updateAvailable:
          type: boolean
        trust:
          $ref: "#/components/schemas/SourceTrust"
        category:
          type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/AppEndpoint"
        services:
          type: array
          items:
            $ref: "#/components/schemas/AppService"
        storage:
          type: array
          items:
            $ref: "#/components/schemas/AppStorageVolume"
        updatedAt:
          type: string
          format: date-time
        installedAt:
          type: string
          format: date-time

    CatalogApp:
      type: object
      required:
        - id
        - name
        - icon
        - description
        - category
        - version
        - installed
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        description:
          type: string
        category:
          type: string
        version:
          type: string
        installed:
          type: boolean
        trust:
          $ref: "#/components/schemas/SourceTrust"

    ProtectionOverview:
      type: object
      required:
        - status
        - rules
        - threatsBlocked24h
        - lastScanAt
        - vpnConnected
        - firewallActive
        - dnsFilteringActive
      properties:
        status:
          $ref: "#/components/schemas/ProtectionStatus"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ProtectionRule"
        threatsBlocked24h:
          type: integer
        lastScanAt:
          type: string
          format: date-time
        vpnConnected:
          type: boolean
        firewallActive:
          type: boolean
        dnsFilteringActive:
          type: boolean

    ActivityEvent:
      type: object
      required:
        - id
        - type
        - title
        - description
        - timestamp
        - severity
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ActivityType"
        title:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        severity:
          $ref: "#/components/schemas/Severity"

    AppEndpoint:
      type: object
      required:
        - label
        - url
        - kind
      properties:
        label:
          type: string
        url:
          type: string
        kind:
          $ref: "#/components/schemas/EndpointKind"

    AppService:
      type: object
      required:
        - name
        - status
        - cpuPercent
        - memoryMb
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/AppStatus"
        cpuPercent:
          type: number
        memoryMb:
          type: number

    AppStorageVolume:
      type: object
      required:
        - name
        - mountPath
        - usedGb
        - totalGb
      properties:
        name:
          type: string
        mountPath:
          type: string
        usedGb:
          type: number
        totalGb:
          type: number

    ProtectionRule:
      type: object
      required:
        - id
        - name
        - enabled
        - category
        - status
        - description
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        category:
          $ref: "#/components/schemas/ProtectionCategory"
        status:
          $ref: "#/components/schemas/HealthStatus"
        description:
          type: string

    ProtectionStatus:
      type: string
      enum: [armed, monitoring, degraded, offline]

    HealthStatus:
      type: string
      enum: [healthy, warning, critical, unknown]

    AppStatus:
      type: string
      enum: [running, stopped, updating, error, installing]

    Severity:
      type: string
      enum: [critical, warning, info, success, error]

    ActivityType:
      type: string
      enum: [app, system, security, update, user]

    ProtectionCategory:
      type: string
      enum: [firewall, vpn, dns, ids, backup]

    EndpointKind:
      type: string
      enum: [web, api, tcp, udp]

    CatalogAppDetail:
      allOf:
        - $ref: "#/components/schemas/CatalogApp"
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        website:
          type: string
        source:
          type: string
        maintainer:
          type: string
        license:
          type: string
        compose:
          $ref: "#/components/schemas/ManifestCompose"
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ManifestEndpoint"
        storage:
          type: array
          items:
            $ref: "#/components/schemas/ManifestStorage"
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/ManifestSecret"
        config:
          type: array
          items:
            $ref: "#/components/schemas/ManifestConfig"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ManifestPermission"

    ManifestCompose:
      type: object
      properties:
